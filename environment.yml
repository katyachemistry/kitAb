# kitAb unified descriptor + post-processing environment
# --------------------------------------
# Covers: developability (calculate_descriptors), IMGT renumbering (ANARCI),
# OpenMM/PDBFixer minimization, utils parsers, and automl under src/.
# Structure *prediction* (ABB2/ABB3/FlashABB) stays in separate backend envs.
#
# CLI tools on PATH after activate:
#   mkdssp   (conda package `dssp`, modern DSSP)
#   freesasa (conda package `freesasa-c`)
#   propka3  (conda package `propka`)
#   mmseqs   (conda package `mmseqs2` from bioconda — sequence clustering for CV folds)
#   parallel (GNU parallel — get_descriptors.sh)
#   hmmscan  (HMMER, pulled in with anarci)
#
# Create (mamba recommended):
#   ./install.sh
#   mamba activate kitab
#
# Verify:
#   python scripts/compare_dssp_binaries.py
#   which mkdssp freesasa propka3
#
# Versions pinned from the existing `developability` conda env (2026-05).

name: kitab

channels:
  - conda-forge
  - bioconda

dependencies:
  # --- Python ---
  - python=3.14.2

  # --- External structure/biophysics CLIs (used by src/get_descriptors.sh) ---
  - dssp=4.6.1          # provides `mkdssp` (set DSSP_BIN=mkdssp in pipeline)
  - freesasa-c=2.1.2    # provides `freesasa`
  - propka=3.5.1        # provides `propka3` (install.sh patches for Python 3.14)
  - mmseqs2             # provides `mmseqs` (sequence-identity clustering for AutoML CV folds)
  - parallel            # GNU parallel (get_descriptors.sh)

  # --- Shared structure post-processing (independent of prediction backends) ---
  - openmm=8.4.0
  - pdbfixer=1.12
  - anarci=2024.05.21   # IMGT numbering + HMMER/hmmscan

  # --- Core scientific Python (developability + automl) ---
  - numpy=2.4.2
  - scipy=1.17.1
  - pandas=3.0.1
  - scikit-learn=1.8.0

  # --- Automl / batch orchestration (src/automl) ---
  - pyyaml=6.0.3        # kitAb manifests and run configs
  - pyarrow=23.0.1      # parquet fold I/O in AutoML

  # --- Optional plotting (soft imports in automl/utils.py) ---
  - matplotlib=3.10.8

  # scikit-learn runtime deps (also pulled transitively; explicit for reproducibility)
  - joblib=1.5.3
  - threadpoolctl=3.6.0

# kitAb FlashABB structure prediction.
# OpenMM / PDBFixer remain because flash-abb imports them; kitAb pipeline
# refinement uses the core `kitab` env instead.
# PyTorch + flash-abb are installed by install.sh (CUDA wheel index is machine-specific).
#
#   mamba env create -f environment-flashabb.yml
#   ./install.sh   # also installs torch + flash-abb into kitab-flashabb

name: flashabb

channels:
  - conda-forge

dependencies:
  - python=3.11
  - openmm=8.4.0
  - pdbfixer=1.12
  - scipy
  - numpy
  - pip>=24.0

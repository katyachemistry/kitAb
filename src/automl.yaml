# kitAb AutoML pipeline settings (internal defaults — not a user config).
#
# The four techniques run in parallel (technique × outer fold × target) via a
# worker pool. Nested CV then picks the technique from inner-fold Spearman
# (never from outer-test), pools those mixed out-of-fold predictions, and
# refits the inner-chosen technique on the whole dataset.
#
# ElasticNet (alpha, l1_ratio) and SFS eval-model choice are resolved inside
# nested CV — there is no separate hyperparameter-tuning stage.
#
# Override for development: run_automl.sh --automl-config PATH

pipeline:
  # Seed for splits, feature selection and every estimator.
  random_state: 42

  # Techniques compared for every target. Drop entries to run fewer (kitAb CLI:
  # --techniques elasticnet,sfs_svm overrides this list).
  #   elasticnet     - ElasticNet on all descriptors, alpha/l1_ratio chosen by CV
  #   intercorr_svm  - intercorrelation pruning, then SVM on every survivor
  #   sfs_svm        - pruning + sequential forward selection driven by an SVM
  #   sfs_knn        - pruning + sequential forward selection driven by KNN
  techniques: [elasticnet, intercorr_svm, sfs_svm, sfs_knn]

  cv:
    # nested: inner folds choose the eval model, ElasticNet grid point, and
    #         which of the four techniques is used for that outer fold's test
    #         predictions (never from outer-test).
    # flat:   no inner scores, so it cannot choose among techniques. Use a
    #         single technique, or nested CV.
    mode: nested
    # Outer folds for datasets without a fold column; per-dataset n_splits and
    # random_seeds in the generated run config take precedence.
    n_splits: 5

  # Prefilters applied before selection in every technique except elasticnet.
  low_variance_relative_std_threshold: 0.01
  # low_variance_epsilon: 1e-8
  intercorr_threshold: 0.9
  intercorr_importance_metric: pearson    # pearson | spearman
  intercorr_reduction_mode: pairwise      # pairwise | cluster

  sfs:
    # Feature budget as a fraction of the training rows.
    features_frac: 0.15
    min_improvement: 0.02
    inner_cv: 5
    # Cross-validation picks one of these to score the selected features.
    eval_models: [svm, knn, linear, randomforest]

  elasticnet:
    alphas: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0]
    l1_ratios: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]

  # Fixed settings for the eval regressors (sklearn defaults where omitted).
  eval_hyperparameters:
    elasticnet:
      alpha: 0.01
    knn:
      weights: distance

  # Permutation importances on the held-out fold; 0 disables.
  permutation_repeats: 10

  save_final_model: true

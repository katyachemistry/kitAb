# Sequences -> structure prediction (ABB2) -> descriptors -> AutoML.
inputs:
  datasets_dir: datasets_example
  split_randomly: [ab21]

run:
  output_dir: scenario1_abb2

structure_prediction:
  enabled: true
  model: abb2
  device: cuda:1
  skip_existing: true

structure_processing:
  enabled: false
  renumber_imgt: false
  minimize: false
  minimize_attempts: 5

descriptors:
  enabled: true

automl:
  enabled: true

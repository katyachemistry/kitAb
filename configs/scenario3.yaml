# Scenario 3: structure prediction + descriptors, no AutoML.
# Equivalent to scenario1.yaml with automl: false (see also scenario1_no_automl.yaml).
input_csvs_folder: datasets

result_folder: scenario3

structure_prediction:
  model: abb3 # abb2 | abb3 | flashabb
  device: 0 # GPU index (0, 1, …) or cuda:0 / cpu
  skip_existing: true
  # batch_size: 4 # default 4 for abb2/abb3; default 50 for flashabb

automl: false

# n_cpu: 4 # number of CPUs to use for descriptors calculation, default all available
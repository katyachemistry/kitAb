# Sequences -> ABB3 structures -> descriptors (no AutoML).
inputs:
  datasets_dir: datasets

run:
  output_dir: scenario3

structure_prediction:
  enabled: true
  model: abb3
  device: cuda:0
  skip_existing: true

structure_processing:
  enabled: false
  renumber_imgt: false
  minimize: false
  minimize_attempts: 5

descriptors:
  enabled: true

automl:
  enabled: false

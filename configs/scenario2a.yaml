# Descriptors only on existing structures (no CSVs, no AutoML).
# cleanup deletes DSSP/PROPKA/FreeSASA intermediates after each JSON.
# batch_size chunks a flat structures folder so peak disk/memory stay bounded.
inputs:
  structures_dir: /storage/antibody_data/PairedStructures/structures

run:
  output_dir: abngs_paired
  n_cpu: 56

structure_prediction:
  enabled: false

structure_processing:
  enabled: false
  renumber_imgt: false
  minimize: false
  minimize_attempts: 5

descriptors:
  enabled: true
  cleanup: true
  batch_size: 10000

automl:
  enabled: false

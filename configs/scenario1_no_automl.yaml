# Predict ABB2 structures and descriptors only (no AutoML).
inputs:
  datasets_dir: data_thera

run:
  output_dir: our_thera_abb2

structure_prediction:
  enabled: true
  model: abb2
  device: cuda:1
  skip_existing: true

structure_processing:
  enabled: false
  renumber_imgt: false
  minimize: false
  minimize_attempts: 5

descriptors:
  enabled: true

automl:
  enabled: false

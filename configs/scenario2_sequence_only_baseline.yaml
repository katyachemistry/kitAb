# Existing ABB2 structures + assay CSVs -> sequence-only descriptors -> AutoML.
inputs:
  datasets_dir: datasets
  structures_dir: structures_abb2
  split_randomly:
  - ab21
  - hutchinson2023enhancement_top200tm1_igg
  - jetha2019homology_RT
  - pdgf38
run:
  output_dir: our_abb2_sequence_only_baseline
structure_prediction:
  enabled: false
structure_processing:
  enabled: false
  renumber_imgt: false
  minimize: false
  minimize_attempts: 5
descriptors:
  enabled: true
  include_features:
  - net_charge_by_pH_3
  - net_charge_by_pH_7.5
  - protein_pi
  - cdr3_length
  - charge_symmetry
  - hyd_score
  - fraction_gly_in_cdr
  - fraction_pro_in_cdr
  - fraction_aro_in_cdr
  - fraction_pos_in_cdr
  - fraction_neg_in_cdr
  - fraction_gln_asn_in_cdr
  - count_AspAsp_cdr
  - count_AspGlu_cdr
  - count_TyrTyr_cdr
automl:
  enabled: true

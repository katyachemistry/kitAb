input_csvs_folder: datasets
split_randomly: ab21.csv,hutchinson2023enhancement_top200tm1_igg.csv,jetha2019homology_RT.csv,pdgf38.csv

input_structures_folder: structures_abb2

result_folder: our_abb2_sequence_only_baseline

# n_cpu: 4 # number of CPUs to use for descriptors calculation and AutoML, default all available

structures_processing:
  renumber_imgt: False
  minimize: False

include_features:
  - net_charge_by_pH_3
  - net_charge_by_pH_7.5
  - protein_pi
  - cdr3_length
  - charge_symmetry
  - hyd_score
  - fraction_gly_in_cdr
  - fraction_pro_in_cdr
  - fraction_aro_in_cdr
  - fraction_pos_in_cdr
  - fraction_neg_in_cdr
  - fraction_gln_asn_in_cdr
  - count_AspAsp_cdr
  - count_AspGlu_cdr
  - count_TyrTyr_cdr
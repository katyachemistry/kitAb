# Sequences -> FlashABB structures -> descriptors -> AutoML.
# Use datasets_example for a quick test; datasets is the full run.
inputs:
  datasets_dir: datasets
  split_randomly:
    - ab21
    - hutchinson2023enhancement_top200tm1_igg
    - jetha2019homology_RT
    - pdgf38

run:
  output_dir: flashabb

structure_prediction:
  enabled: true
  model: flashabb
  device: cuda:1
  skip_existing: true

structure_processing:
  enabled: false
  renumber_imgt: false
  minimize: false
  minimize_attempts: 5

descriptors:
  enabled: true

automl:
  enabled: true

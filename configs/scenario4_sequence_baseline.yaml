# AutoML on precomputed ProperMAb descriptors (sequence features only).
inputs:
  datasets_dir: datasets_ginkgo_no_hc_lc
  predefined_descriptors_dir: /storage/antibody_data/PairedStructures/kitAb/descriptors_propermab_abb2

run:
  output_dir: propermab_sequence_baseline_ginkgo_no_hc_lc

structure_prediction:
  enabled: false

descriptors:
  enabled: false
  include_features:
    - cdr_h3_length
    - aromatic_cdr
    - theoretical_pi
    - n_charged_res_fv
    - fv_charge
    - fv_csp

automl:
  enabled: true

# Descriptors only on existing TheraSAbDab structures (no CSVs, no AutoML).
inputs:
  structures_dir: /storage/antibody_data/PairedStructures/structures_thera

run:
  output_dir: thera_sabdab_742_structures
  n_cpu: 56

structure_prediction:
  enabled: false

structure_processing:
  enabled: false
  renumber_imgt: false
  minimize: false
  minimize_attempts: 5

descriptors:
  enabled: true
  cleanup: true
  # omit batch_size to process all structures in one pass (~700)

automl:
  enabled: false
